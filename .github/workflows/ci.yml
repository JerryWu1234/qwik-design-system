name: CI

permissions:
  contents: read

on: ["push", "pull_request"]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node: [22.12]
        experimental: [false]
    name: 👷 QDS CI Node-${{ matrix.node }} under ${{ matrix.os }}

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 🎉 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
      
      - name: 🗂️ Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: 💾 Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: ✨ Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 🔍 Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(jq -r '.devDependencies.playwright' package.json | tr -d '^~')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🎭 Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: 💾 Cache build outputs
        uses: actions/cache@v4
        id: build-cache
        with:
          path: |
            libs/tools/dist
            libs/utils/lib
            libs/utils/lib-types
            **/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('libs/tools/**', 'libs/utils/**', '!**/node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: 🔨 Build underlying tools and utilities
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter ./libs/tools build
          pnpm --filter ./libs/utils build

      - name: ✅ Check code style
        run: pnpm check

      - name: 🧪 Run tests
        run: pnpm test